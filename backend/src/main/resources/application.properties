# ===== Base de datos (XAMPP / MySQL local) =====
spring.datasource.url=jdbc:mysql://localhost:3306/migestorfinanzas_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Crea o actualiza las tablas a partir de las entidades si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Servidor =====
server.port=8080

# Origen permitido para el frontend (React + Vite)
app.cors.origen=http://localhost:5173
# Duracion de la sesion en horas
app.sesion.horas=8
